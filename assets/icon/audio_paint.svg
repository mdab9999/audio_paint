<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Audio Paint app icon: spectrally coloured waveform bars with a paintbrush. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset="1" stop-color="#0c0a1f"/>
    </linearGradient>
    <linearGradient id="spectral" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#8b3dff"/>
      <stop offset="0.35" stop-color="#e3256b"/>
      <stop offset="0.7" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a7a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#b9b3d6"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dce8"/>
      <stop offset="0.5" stop-color="#9aa0b5"/>
      <stop offset="1" stop-color="#6d7288"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Soft glow behind the waveform -->
  <ellipse cx="256" cy="250" rx="200" ry="150" fill="url(#glow)"/>

  <!-- Waveform bars, coloured like a spectrogram -->
  <g fill="url(#spectral)">
    <rect x="85"  y="211" width="26" height="78"  rx="13"/>
    <rect x="129" y="161" width="26" height="178" rx="13"/>
    <rect x="173" y="111" width="26" height="278" rx="13"/>
    <rect x="217" y="76"  width="26" height="348" rx="13"/>
    <rect x="261" y="136" width="26" height="228" rx="13"/>
    <rect x="305" y="96"  width="26" height="308" rx="13"/>
    <rect x="349" y="171" width="26" height="158" rx="13"/>
    <rect x="393" y="216" width="26" height="68"  rx="13"/>
  </g>

  <!-- Paintbrush, tip touching the waveform -->
  <g transform="translate(372 368) rotate(45)">
    <!-- dark outline separates the brush from the bars -->
    <g stroke="#0c0a1f" stroke-width="14" stroke-linejoin="round" fill="#0c0a1f">
      <rect x="-17" y="-138" width="34" height="98" rx="17"/>
      <rect x="-20" y="-46" width="40" height="44" rx="6"/>
      <path d="M -20 -4 L 20 -4 C 22 30 12 58 0 84 C -12 58 -22 30 -20 -4 Z"/>
    </g>
    <rect x="-17" y="-138" width="34" height="98" rx="17" fill="url(#handle)"/>
    <rect x="-20" y="-46" width="40" height="44" rx="6" fill="url(#ferrule)"/>
    <rect x="-20" y="-34" width="40" height="5" fill="#5c6178" opacity="0.6"/>
    <path d="M -20 -4 L 20 -4 C 22 30 12 58 0 84 C -12 58 -22 30 -20 -4 Z" fill="url(#bristles)"/>
    <path d="M -4 6 C -4 34 -2 52 0 70" stroke="#ff8a00" stroke-width="4" fill="none"
          stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
