<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Simplified Audio Paint icon for 16-32 px: fewer, bolder bars and no brush. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset="1" stop-color="#0c0a1f"/>
    </linearGradient>
    <linearGradient id="spectral" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#8b3dff"/>
      <stop offset="0.35" stop-color="#e3256b"/>
      <stop offset="0.7" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <g fill="url(#spectral)">
    <rect x="80"  y="192" width="64" height="128" rx="32"/>
    <rect x="176" y="96"  width="64" height="320" rx="32"/>
    <rect x="272" y="48"  width="64" height="416" rx="32"/>
    <rect x="368" y="144" width="64" height="224" rx="32"/>
  </g>
</svg>
